<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPET Reports</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1419;
      --panel: #12212a;
      --line: rgba(255,255,255,0.08);
      --text: #eef2f4;
      --muted: #9fb1bc;
      --accent: #6fd4c4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(111,212,196,0.12), transparent 32%),
        linear-gradient(180deg, #0b1217, var(--bg));
      color: var(--text);
    }
    main {
      width: min(720px, 100%);
      padding: 28px;
      border-radius: 24px;
      background: rgba(18, 33, 42, 0.88);
      border: 1px solid var(--line);
      box-shadow: 0 24px 64px rgba(0,0,0,0.28);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
    }
    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.6;
    }
    .report-list {
      display: grid;
      gap: 14px;
    }
    a {
      display: block;
      padding: 16px 18px;
      border-radius: 18px;
      text-decoration: none;
      color: var(--text);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
    }
    a strong {
      display: block;
      margin-bottom: 6px;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>CPET Report Library</h1>
    <p>Oracle demo host static reports. Share the detail URL directly for a standalone viewer.</p>
    <div class="report-list">
      <a href="./geunyun-park-belgium-lactate/">
        <strong>Geunyun Park Belgium Lactate Report</strong>
        /cpet/report/geunyun-park-belgium-lactate/
      </a>
      <a href="./hong-changsun-belgium-lactate/">
        <strong>Hong Changsun Belgium Lactate Report</strong>
        /cpet/report/hong-changsun-belgium-lactate/
      </a>
    </div>
  </main>
</body>
</html>
