<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <rect width="256" height="256" fill="#0f172a" rx="32"/>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Code file background -->
  <rect x="76" y="60" width="104" height="136" rx="10" fill="#8b5cf6" opacity="0.08" stroke="#8b5cf6" stroke-width="2" opacity="0.4"/>

  <!-- Code lines -->
  <rect x="92" y="84" width="56" height="4" rx="2" fill="#8b5cf6" opacity="0.5"/>
  <rect x="92" y="96" width="40" height="4" rx="2" fill="#8b5cf6" opacity="0.35"/>
  <rect x="100" y="108" width="48" height="4" rx="2" fill="#8b5cf6" opacity="0.4"/>
  <rect x="100" y="120" width="32" height="4" rx="2" fill="#8b5cf6" opacity="0.3"/>
  <rect x="92" y="132" width="44" height="4" rx="2" fill="#8b5cf6" opacity="0.35"/>

  <!-- Magnifying glass -->
  <circle cx="152" cy="156" r="26" fill="#8b5cf6" opacity="0.12" stroke="#8b5cf6" stroke-width="3.5" filter="url(#glow)"/>
  <circle cx="152" cy="156" r="18" fill="none" stroke="#8b5cf6" stroke-width="3" opacity="0.7"/>
  <!-- Glass handle -->
  <line x1="165" y1="169" x2="178" y2="182" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Check tick inside glass -->
  <path d="M144 156 L150 162 L162 150" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

  <!-- Git branch node top left -->
  <circle cx="96" cy="168" r="6" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="80" cy="188" r="5" fill="#8b5cf6" opacity="0.35"/>
  <line x1="96" y1="168" x2="80" y2="188" stroke="#8b5cf6" stroke-width="1.5" opacity="0.4"/>
</svg>
