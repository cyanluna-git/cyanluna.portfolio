<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" fill="#ECFDF5"/>
  <!-- Wheels -->
  <circle cx="34" cy="65" r="14" fill="none" stroke="#10B981" stroke-width="3"/>
  <circle cx="66" cy="65" r="14" fill="none" stroke="#10B981" stroke-width="3"/>
  <!-- Frame -->
  <polyline points="34,65 50,44 66,65" fill="none" stroke="#10B981" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="50" y1="44" x2="58" y2="36" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
  <line x1="44" y1="52" x2="58" y2="36" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="52" x2="34" y2="65" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Handlebar -->
  <line x1="58" y1="36" x2="63" y2="33" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="63" y1="33" x2="65" y2="38" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Saddle -->
  <line x1="47" y1="43" x2="55" y2="43" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hub dots -->
  <circle cx="34" cy="65" r="3" fill="#10B981"/>
  <circle cx="66" cy="65" r="3" fill="#10B981"/>
  <!-- Power chart -->
  <rect x="19" y="25" width="4" height="9" rx="1" fill="#10B981" opacity="0.5"/>
  <rect x="25" y="21" width="4" height="13" rx="1" fill="#10B981" opacity="0.7"/>
  <rect x="31" y="23" width="4" height="11" rx="1" fill="#10B981" opacity="0.6"/>
</svg>
