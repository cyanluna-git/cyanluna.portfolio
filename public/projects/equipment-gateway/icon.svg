<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <rect width="256" height="256" fill="#0f172a" rx="32"/>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Central gateway box -->
  <rect x="96" y="96" width="64" height="64" rx="10" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  <!-- Gateway inner dot -->
  <circle cx="128" cy="128" r="8" fill="#3b82f6" opacity="0.7" filter="url(#glow)"/>

  <!-- Left device -->
  <rect x="44" y="108" width="32" height="40" rx="6" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  <circle cx="60" cy="128" r="5" fill="#3b82f6" opacity="0.5"/>

  <!-- Right device -->
  <rect x="180" y="108" width="32" height="40" rx="6" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  <circle cx="196" cy="128" r="5" fill="#3b82f6" opacity="0.5"/>

  <!-- Top device (cloud) -->
  <rect x="108" y="44" width="40" height="28" rx="6" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  <circle cx="128" cy="58" r="5" fill="#3b82f6" opacity="0.5"/>

  <!-- Bottom device (DB) -->
  <rect x="108" y="184" width="40" height="28" rx="6" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>
  <circle cx="128" cy="198" r="5" fill="#3b82f6" opacity="0.5"/>

  <!-- Connecting lines -->
  <line x1="76" y1="128" x2="96" y2="128" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  <line x1="160" y1="128" x2="180" y2="128" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  <line x1="128" y1="72" x2="128" y2="96" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  <line x1="128" y1="160" x2="128" y2="184" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
</svg>
