<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <rect width="256" height="256" fill="#0f172a" rx="32"/>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Jira-style compass/ticket left block -->
  <rect x="56" y="84" width="64" height="88" rx="10" fill="#8b5cf6" opacity="0.1" stroke="#8b5cf6" stroke-width="2" opacity="0.4"/>
  <!-- Ticket lines -->
  <rect x="68" y="104" width="40" height="4" rx="2" fill="#8b5cf6" opacity="0.5"/>
  <rect x="68" y="116" width="28" height="4" rx="2" fill="#8b5cf6" opacity="0.35"/>
  <rect x="68" y="128" width="34" height="4" rx="2" fill="#8b5cf6" opacity="0.4"/>
  <rect x="68" y="140" width="22" height="4" rx="2" fill="#8b5cf6" opacity="0.3"/>

  <!-- Arrow bridge -->
  <path d="M124 120 L136 120 M132 116 L136 120 L132 124" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Slack-style lightning right block -->
  <rect x="140" y="84" width="60" height="88" rx="10" fill="#8b5cf6" opacity="0.1" stroke="#8b5cf6" stroke-width="2" opacity="0.4"/>
  <!-- Lightning bolt -->
  <path d="M168 96 L158 120 L166 120 L156 148 L174 116 L165 116 L176 96 Z"
        fill="#8b5cf6" opacity="0.6" filter="url(#glow)"/>

  <!-- Bell icon small accent bottom right -->
  <path d="M190 178 Q190 170 200 170 Q210 170 210 178 L210 186 Q210 190 200 190 Q190 190 190 186 Z"
        fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.4"/>
  <line x1="200" y1="190" x2="200" y2="194" stroke="#8b5cf6" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
</svg>
