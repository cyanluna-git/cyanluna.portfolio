<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark anvil silhouette -->
  <g id="anvil">
    <!-- Main anvil body -->
    <path d="M 75 160 L 100 110 L 160 110 L 160 155 Q 160 175 140 175 L 95 175 Q 75 175 75 160 Z"
          fill="#1e293b" stroke="none"/>

    <!-- Left horn -->
    <path d="M 85 150 Q 60 145 55 125 Q 52 110 68 105 L 80 125 Z"
          fill="#1e293b" stroke="none"/>

    <!-- Right horn -->
    <path d="M 155 150 Q 180 145 185 125 Q 188 110 172 105 L 160 125 Z"
          fill="#1e293b" stroke="none"/>

    <!-- Feet -->
    <rect x="90" y="170" width="80" height="18" fill="#1e293b" rx="2"/>
    <rect x="85" y="185" width="90" height="6" fill="#0f172a" rx="1"/>
  </g>

  <!-- GPIO pins (cyan dots) arranged on anvil surface -->
  <g id="gpio-pins">
    <!-- Top row -->
    <circle cx="100" cy="125" r="7" fill="#06b6d4"/>
    <circle cx="128" cy="125" r="7" fill="#06b6d4"/>
    <circle cx="156" cy="125" r="7" fill="#06b6d4"/>

    <!-- Middle row -->
    <circle cx="114" cy="150" r="7" fill="#06b6d4"/>
    <circle cx="142" cy="150" r="7" fill="#06b6d4"/>

    <!-- Bottom accent (optional 6th pin) -->
    <circle cx="128" cy="165" r="5" fill="#06b6d4" opacity="0.6"/>
  </g>

  <!-- Glow effect -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="gpio-glow" opacity="0.25" filter="url(#glow)">
    <circle cx="100" cy="125" r="9" fill="#22d3ee"/>
    <circle cx="128" cy="125" r="9" fill="#22d3ee"/>
    <circle cx="156" cy="125" r="9" fill="#22d3ee"/>
    <circle cx="114" cy="150" r="9" fill="#22d3ee"/>
    <circle cx="142" cy="150" r="9" fill="#22d3ee"/>
  </g>
</svg>
